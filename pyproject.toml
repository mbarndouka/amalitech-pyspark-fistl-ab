[project]
name = "movie_data_analysis"
version = "0.1.0"
description = "Production-grade movie data analysis pipeline — PySpark + TMDB + Docker + K8s"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=20"