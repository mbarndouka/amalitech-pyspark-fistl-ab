[tmdb]
baseUrl = "https://api.themoviedb.org/3"
request_timeout = 10
max_retries = 3
rate_limit = 40
rate_limit_period = 10

[storage]
raw_data_path = "data/raw"
processed_data_path = "data/processed"
cache_path = "data/cache"

[spark]
app_name = "TMDB Data Processing"
master = "local[*]"
executor_memory = "2g"
driver_memory = "2g"
sql_shuffle_partitions = 10
spark_log_level = "WARN"

[pipeline]
env = "dev"
batch_size = 10
num_workers = 4
logging_level = "INFO"
logging_format = "json"

[visualization]
# Primary palette — used for series, bars, scatter points
palette = ["#E74C3C", "#3498DB", "#2ECC71", "#F39C12", "#9B59B6", "#1ABC9C", "#E67E22", "#E91E63"]
# Diverging pair for Franchise / Standalone comparisons
franchise_color  = "#3498DB"
standalone_color = "#E74C3C"
# Canvas
background_color = "#1A1A2E"
surface_color    = "#16213E"
grid_color       = "#2D2D44"
# Typography
text_color       = "#EAEAEA"
muted_color      = "#8899AA"
# Figure defaults
fig_dpi    = 150
fig_width  = 14
fig_height = 8
# Where to save PNG files
output_dir = "data/plots"

